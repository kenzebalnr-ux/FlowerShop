services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/flowershop.db
      FLOWERSHOP_ADMIN_EMAIL: ${FLOWERSHOP_ADMIN_EMAIL:-admin@flowershop.kz}
      FLOWERSHOP_ADMIN_PASSWORD: ${FLOWERSHOP_ADMIN_PASSWORD:-}
    volumes:
      - flowershop_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  flowershop_data:
